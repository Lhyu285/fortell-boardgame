server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true

spring:
  application:
    name: boardgame-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:./boardgame.db}
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always

app:
  allowed-origin-patterns: ${APP_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,http://*:5173,https://*:5173,https://*.cpolar.top,http://*.cpolar.top}

logging:
  level:
    com.fortell.boardgame: INFO
